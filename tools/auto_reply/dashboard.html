<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>微信自动回复 · DeepSeek Harness</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#172434;font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1100px;margin:42px auto;padding:0 24px}h1{font-size:30px;margin:5px 0}h2{font-size:19px;margin-top:0}.eyebrow{color:#257256;font-size:12px;letter-spacing:2px}.muted{color:#687583}.panel{background:white;border:1px solid #e1e6ea;border-radius:16px;padding:24px;margin:22px 0}label{display:block;margin:12px 0 5px}select,textarea,input{width:100%;border:1px solid #cbd5dd;border-radius:8px;padding:10px;font:inherit}textarea{height:86px}button{padding:9px 16px;border:0;border-radius:8px;background:#157455;color:white;font:inherit;cursor:pointer;margin:8px 8px 0 0}button.secondary{background:#e8edf0;color:#273c4b}button:disabled{opacity:.5;cursor:wait}.rule{border-top:1px solid #e5e9ec;padding:18px 0;display:flex;justify-content:space-between;gap:20px}.badge{border-radius:20px;background:#edf5f0;color:#236342;padding:3px 10px;font-size:12px}table{width:100%;border-collapse:collapse;text-align:left}td,th{padding:12px 8px;border-bottom:1px solid #e5e9ec;vertical-align:top}#error{color:#a4352c;white-space:pre-wrap}.small{font-size:12px}.row{display:grid;grid-template-columns:3fr 1fr;gap:18px}
</style><main><div class="eyebrow">MESSAGING RUNTIME / AUTOREPLY</div><h1>让消息得到回应</h1><p class="muted">选择会话与回复方式。DeepSeek Harness 处理新消息，微信在后台发送。</p><div id="error"></div>
<section class="panel"><h2>添加自动回复会话</h2><button class="secondary" id="refresh">读取微信会话列表</button><div class="row"><div><label>联系人或群组</label><select id="conversation"><option value="">先读取会话列表</option></select></div><div><label>会话类型</label><select id="kind"><option value="direct">联系人</option><option value="group">群组</option></select></div></div><label>回复规则</label><textarea id="prompt" placeholder="例如：用自然、简短、友好的中文回复；不确定的事情直接说明，不编造。"></textarea><button id="add">保存规则</button><p class="muted small">保存后点击“启用自动回复”，即授权回复该会话后续的新文字消息。群组模式处理所有新文字消息；本版不提供可靠的 @ 触发。首次启用只建立基线，不回复历史消息。</p></section>
<section class="panel"><h2>正在管理的会话 <span class="badge" id="agent">DeepSeek Harness</span></h2><div id="rules">正在连接…</div><p class="muted small">暂停立即阻止后续发送；已经提交的消息无法撤回。请保持微信登录、非最小化。人工发送、草稿冲突或识别不确定时会暂停。</p></section>
<section class="panel"><h2>最近处理记录</h2><table><thead><tr><th>时间</th><th>状态</th><th>回复 / 说明</th></tr></thead><tbody id="jobs"></tbody></table></section></main>
<script>
let token=location.hash.slice(1);if(token){sessionStorage.setItem('autoreplyToken',token);history.replaceState(null,'',location.pathname)}else token=sessionStorage.getItem('autoreplyToken')||'';
const names={paused:'已暂停',starting:'建立基线',listening:'监听中',settling:'核对新消息',queued:'等待处理',generating:'Agent 处理中',sending:'后台发送中',sent:'已提交发送',blocked:'需要检查',needs_user:'等待人工处理',waiting_connection:'等待连接',skip:'无需回复',cancelled:'已取消',superseded:'已被新消息替代',uncertain:'发送结果不确定',not_sent:'未发送',expired:'任务已过期'};
const el=id=>document.getElementById(id);function node(tag,text){const n=document.createElement(tag);n.textContent=text;return n}
async function api(path,data){const r=await fetch(path,{method:data?'POST':'GET',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},...(data?{body:JSON.stringify(data)}:{})});const body=await r.json();if(!r.ok)throw Error(body.error||'请求失败');return body}
async function action(fn){el('error').textContent='';try{await fn()}catch(e){el('error').textContent=e.message}}
async function status(){const s=await api('/api/status');el('agent').textContent=s.agent+' · '+s.model;el('rules').replaceChildren();if(!s.rules.length)el('rules').append(node('p','还没有规则。添加联系人或群组后，即可启用自动回复。'));for(const r of s.rules){const box=node('div','');box.className='rule';const info=node('div','');info.append(node('strong',r.title+' · '+(r.kind==='group'?'群组':'联系人')),node('p',r.prompt),node('div',(names[r.status]||r.status)+(r.detail?' · '+r.detail:'')),node('div',r.observed_at?'最近观察：'+new Date(r.observed_at*1000).toLocaleTimeString():'尚未观察'));const controls=node('div','');const b=node('button',r.enabled&&!['blocked','needs_user'].includes(r.status)?'暂停':'启用自动回复');b.onclick=()=>action(async()=>{await api(r.enabled&&!['blocked','needs_user'].includes(r.status)?'/api/pause':'/api/enable',{id:r.id});await status()});controls.append(b);const edit=node('button','编辑规则');edit.className='secondary';edit.onclick=()=>action(async()=>{const prompt=window.prompt('修改回复规则（保存后暂停，需重新启用）',r.prompt);if(prompt!==null){await api('/api/edit',{id:r.id,prompt});await status()}});controls.append(edit);if(r.enabled&&['blocked','needs_user'].includes(r.status)){const p=node('button','保持暂停');p.className='secondary';p.onclick=()=>action(async()=>{await api('/api/pause',{id:r.id});await status()});controls.append(p)}box.append(info,controls);el('rules').append(box)}el('jobs').replaceChildren();for(const j of s.jobs){const tr=node('tr','');tr.append(node('td',new Date(j.created_at*1000).toLocaleTimeString()),node('td',names[j.state]||j.state),node('td',j.text||j.detail||'—'));el('jobs').append(tr)}if(s.error)el('error').textContent=s.error}
el('refresh').onclick=()=>action(async()=>{const result=await api('/api/conversations');el('conversation').replaceChildren(node('option','请选择会话'));el('conversation').firstChild.value='';for(const c of result.conversations){const opt=node('option',c.title);opt.value=c.id;el('conversation').append(opt)}});
el('add').onclick=()=>action(async()=>{await api('/api/rules',{conversation_id:el('conversation').value,kind:el('kind').value,prompt:el('prompt').value});await status()});action(status);setInterval(()=>action(status),4000);
</script></html>
